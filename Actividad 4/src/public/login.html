<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Proyecto Backend</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Para que el padding no rompa el ancho */
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background-color: #0056b3; }
        #mensaje {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="******">
            </div>
            <button type="submit">Ingresar</button>
        </form>
        <div id="mensaje"></div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const mensajeDiv = document.getElementById('mensaje');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue

            // 1. Capturar los datos del formulario
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // 2. Enviar los datos al backend (Endpoint creado en el Paso 6)
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 3. Si el login es correcto, guardamos el JWT en el navegador
                    localStorage.setItem('token', data.token);
                    
                    mensajeDiv.style.color = 'green';
                    mensajeDiv.textContent = '¡Login exitoso! Token guardado.';
                    console.log('Token recibido:', data.token);
                    
                    // Aquí podrías redirigir a otra página si quisieras
                    // window.location.href = '/dashboard.html';
                } else {
                    // 4. Si hay error (contraseña mal), mostrar mensaje
                    mensajeDiv.style.color = 'red';
                    mensajeDiv.textContent = data.msg || 'Error al iniciar sesión';
                }
            } catch (error) {
                console.error('Error:', error);
                mensajeDiv.style.color = 'red';
                mensajeDiv.textContent = 'Error de conexión con el servidor';
            }
        });
    </script>
</body>
</html>
